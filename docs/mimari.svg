    <line x1="260" y1="142" x2="95" y2="142" stroke-dasharray="5 4"/>
    <line x1="90" y1="172" x2="255" y2="172"/>
    <line x1="260" y1="247" x2="435" y2="247"/>
    <line x1="440" y1="277" x2="265" y2="277" stroke-dasharray="5 4"/>
    <line x1="260" y1="342" x2="625" y2="342"/>
    <line x1="630" y1="370" x2="265" y2="370" stroke-dasharray="5 4"/>
    <line x1="260" y1="432" x2="795" y2="432"/>
    <line x1="800" y1="460" x2="265" y2="460" stroke-dasharray="5 4"/>
    <line x1="260" y1="512" x2="95" y2="512" stroke-dasharray="5 4"/>
