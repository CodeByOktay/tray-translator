  <text x="318" y="205" font-size="12" fill="#0f172a">ayrı iş parçacığı</text>

  <!-- Kendi kendine cagri: arsiv kaydi -->
  <path d="M260 535 L310 535 L310 555 L265 555" fill="none" stroke="#334155" stroke-width="1.4" marker-end="url(#ok)"/>
  <text x="318" y="550" font-size="12" fill="#0f172a">arşive kaydet</text>

  <!-- alt / else cercevesi -->
  <rect x="200" y="292" width="670" height="188" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <path d="M200 292 L248 292 L248 306 L238 314 L200 314 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="210" y="306" font-size="11" font-weight="600" fill="#475569">alt</text>
  <line x1="200" y1="388" x2="870" y2="388" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="256" y="308" font-size="11" font-style="italic" fill="#475569">[bulut sağlayıcı seçili — varsayılan]</text>
  <text x="210" y="404" font-size="11" font-style="italic" fill="#475569">[yerel model seçili]</text>
