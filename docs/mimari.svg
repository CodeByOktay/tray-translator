    <text x="350" y="268">Translator nesnesi</text>
    <text x="445" y="333">HTTPS isteği</text>
    <text x="445" y="361">çeviri sonucu</text>
    <text x="530" y="423">localhost:11434</text>
    <text x="530" y="451">çeviri sonucu</text>
